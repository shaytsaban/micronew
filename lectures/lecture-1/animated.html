body{font-family:'Heebo','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;text-align:right;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--tc)}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-feature-settings:"tnum"}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
/* app shell */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--ink);color:#fff;font-size:15px}
.bar .ttl{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .cnt{opacity:.8;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ib{background:rgba(255,255,255,.12);border:0;border-radius:9px;color:#fff;padding:5px 11px;cursor:pointer;font-size:14px;white-space:nowrap}
.ib:hover{background:rgba(255,255,255,.24)}
.ib kbd{opacity:.65;font-family:inherit;font-size:12px;margin-inline-start:4px}
.progress{height:4px;background:#c9c3b4}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--x),var(--y));transition:width .35s}
#stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow:auto;padding:22px clamp(14px,3.2vw,48px) 96px;animation:sin .35s ease both}
@keyframes sin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.slide.back{animation-name:sinb}
@keyframes sinb{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.foot{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,rgba(245,242,235,0),var(--bg) 40%);z-index:5}
.foot .sp{flex:1}
.nb{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:9px 20px;font-weight:700;cursor:pointer;font-size:16px}
.nb.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.nb:disabled{opacity:.35;cursor:default}
.stephint{font-size:14px;color:var(--mut);white-space:nowrap}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#cfc8b8;transition:.2s}
.dots i.on{background:var(--y);transform:scale(1.25)}
/* slide anatomy */
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 14px}
.sh h2{margin:0;font-size:clamp(26px,3.4vw,40px);line-height:1.15;letter-spacing:-.01em}
.sh .kick{font-size:14px;font-weight:700;color:#fff;background:var(--x);border-radius:99px;padding:2px 12px}
.sh .kick.y{background:var(--y)} .sh .kick.t{background:var(--tc)} .sh .kick.p{background:var(--ac)}
.lead{font-size:clamp(18px,1.9vw,24px);color:var(--ink2);margin:0 0 14px;max-width:62ch}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.cols.eq{grid-template-columns:1fr 1fr}
.cols.wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:900px){.cols,.cols.eq,.cols.wide{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;border:1px solid #efe9dc}
.card h3{margin:0 0 8px;font-size:20px}
.card.x{border-top:5px solid var(--x)} .card.y{border-top:5px solid var(--y)} .card.ok{border-top:5px solid var(--ok)}
.card.tc{border-top:5px solid var(--tc)} .card.ac{border-top:5px solid var(--ac)} .card.mc{border-top:5px solid var(--mc)}
.stack>*+*{margin-top:12px}
ul.l{margin:0;padding:0 20px 0 0} ul.l li{margin:5px 0}
.x-c{color:var(--x);font-weight:700}.y-c{color:var(--y);font-weight:700}.ok-c{color:var(--ok);font-weight:700}.low-c{color:var(--low);font-weight:700}.bad-c{color:var(--bad);font-weight:700}
.tc-c{color:var(--tc);font-weight:700}.ac-c{color:var(--ac);font-weight:700}.mc-c{color:var(--mc);font-weight:700}
.bg-x{background:var(--xs)}.bg-y{background:var(--ys)}.bg-ok{background:var(--oks)}.bg-low{background:var(--lows)}.bg-bad{background:var(--bads)}
/* steps */
.rv{transition:opacity .45s,transform .45s}
.rv:not(.on){display:none!important}
.rv.on{animation:rvin .5s both}
@keyframes rvin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* pause card */
.ask{border:2.5px dashed var(--gold);background:#fff8dc;border-radius:var(--r);padding:12px 16px;font-size:clamp(18px,2vw,24px);font-weight:700;display:flex;gap:12px;align-items:center}
.ask .pi{flex:0 0 auto;width:26px;height:26px;background:linear-gradient(90deg,var(--ink) 0 36%,transparent 36% 64%,var(--ink) 64%);border-radius:3px;font-size:0;display:inline-block}
.ask small{display:block;font-weight:500;font-size:14px;color:var(--ink2)}
/* formula box */
.fm{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:12px 18px;margin:8px 0;font-size:clamp(20px,2.3vw,28px);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.fm .lb{font-size:14px;font-weight:700;background:var(--ink);color:#fff;border-radius:7px;padding:1px 9px;white-space:nowrap}
.fm.tc{border-color:var(--tc)} .fm.tc .lb{background:var(--tc)}
.fm.ac{border-color:var(--ac)} .fm.ac .lb{background:var(--ac)}
.fm.mc{border-color:var(--mc)} .fm.mc .lb{background:var(--mc)}
.fm .sub{font-size:.62em;color:var(--ink2);font-weight:500}
.fm .big{font-size:1.1em;font-weight:700}
/* mantra */
.mantra{display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;margin-top:14px;font-weight:600;font-size:clamp(16px,1.7vw,21px)}
.mantra .mi{background:var(--gold);color:var(--ink);font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px;white-space:nowrap}
.mantra .t{flex:1}
.solves{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--oks);border:1.5px solid var(--ok);border-radius:12px;padding:8px 14px;margin-top:12px;font-size:16px}
.solves b{color:#146c3c}
.chip{display:inline-block;border-radius:99px;padding:1px 11px;font-size:14px;font-weight:700;background:#fff;border:1.5px solid var(--ok);color:#146c3c;cursor:pointer;text-decoration:none}
.chip:hover{background:var(--ok);color:#fff}
.chip.q{border-color:var(--ac);color:var(--ac)} .chip.q:hover{background:var(--ac);color:#fff}
/* terms */
.term{border-bottom:2px dotted var(--y);cursor:help;font-weight:600;color:inherit;background:none;border-top:0;border-left:0;border-right:0;padding:0;font-size:inherit}
.term:hover{background:var(--ys)}
/* tables */
table.t{border-collapse:separate;border-spacing:0;border-radius:12px;overflow:hidden;box-shadow:var(--sh);background:#fff;font-size:17px;direction:rtl}
table.t th{background:var(--ink);color:#fff;padding:7px 14px;font-weight:700}
table.t td{padding:6px 14px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.hl,table.t tr.hl td{background:#fff3cf}
table.t tr.on td{background:#fff3cf}
table.t input{width:5.2em;font:inherit;text-align:center;border:2px solid var(--line);border-radius:8px;padding:2px 4px;direction:ltr}
table.t input.ok{border-color:var(--ok);background:var(--oks)} table.t input.no{border-color:var(--bad);background:var(--bads)}
/* controls */
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0}
.ctl label{font-weight:700;white-space:nowrap}
.ctl output{font-weight:800;min-width:3.2em;text-align:center;direction:ltr;background:var(--ys);border-radius:8px;padding:0 8px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--y);height:28px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:11px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.seg button.x.on{background:var(--x)} .seg button.y.on{background:var(--y)}
.btn{border:2px solid var(--ink);background:#fff;border-radius:11px;padding:6px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ink);color:#fff}
.btn.pri{background:var(--ink);color:#fff}.btn.pri:hover{background:var(--tc)}
.btn.sm{padding:2px 11px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.fb{border-radius:12px;padding:8px 14px;margin:8px 0;font-weight:600}
.fb.ok{background:var(--oks);border:1.5px solid var(--ok)} .fb.no{background:var(--bads);border:1.5px solid var(--bad)} .fb.nt{background:var(--lows);border:1.5px solid var(--low)}
.tryit{border:2.5px solid var(--ac);border-radius:var(--r);background:#fff;padding:12px 16px}
.tryit .th{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.tryit .th b{background:var(--ac);color:#fff;border-radius:8px;padding:1px 12px;font-size:15px}
.hint{font-size:16px;color:var(--ink2)}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.ansrow input{font:inherit;width:7em;border:2px solid var(--line);border-radius:10px;padding:4px 10px;direction:ltr;text-align:center}
.ansrow input:focus{outline:none;border-color:var(--ac)}
/* chart */
svg.ch{display:block;width:100%;height:auto;direction:ltr;background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid #efe9dc;touch-action:none;user-select:none}
svg.ch text{font-family:'Heebo',sans-serif;fill:var(--ink)}
.ch .ax{stroke:var(--ink);stroke-width:2;fill:none}
.ch .grid{stroke:#eee8da;stroke-width:1}
.ch .tick{stroke:var(--ink);stroke-width:1.5}
.ch .tl{font-size:13px;fill:var(--ink2)}
.ch .al{font-size:15px;font-weight:700}
.ch .curve{fill:none;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.ch .curve.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.ch .curve.draw.go{stroke-dashoffset:0;transition:stroke-dashoffset var(--dur,1.4s) ease}
.ch .seg-hl{fill:none;stroke:var(--mc);stroke-width:7;stroke-linecap:round;opacity:.9}
.ch .pt{fill:var(--ink);stroke:#fff;stroke-width:2.5}
.ch .pt.ok{fill:var(--ok)}.ch .pt.low{fill:var(--low)}.ch .pt.bad{fill:var(--bad)}.ch .pt.x{fill:var(--x)}.ch .pt.y{fill:var(--y)}.ch .pt.mc{fill:var(--mc)}.ch .pt.gold{fill:var(--gold)}
.ch .pt.hollow{fill:#fff;stroke:var(--ink);stroke-width:3}
.ch .pl{font-size:15px;font-weight:700}
.ch .guide{stroke:var(--mut);stroke-width:1.6;stroke-dasharray:5 5;fill:none}
.ch .guide.x{stroke:var(--x);stroke-width:2.2}.ch .guide.y{stroke:var(--y);stroke-width:2.2}
.ch .br{stroke:var(--tc);stroke-width:4;fill:none;stroke-linecap:round}
.ch .br.ac{stroke:var(--ac)}.ch .br.mc{stroke:var(--mc)}.ch .br.x{stroke:var(--x)}.ch .br.y{stroke:var(--y)}
.ch .zone.ok{fill:var(--oks)}.ch .zone.low{fill:var(--lows)}.ch .zone.bad{fill:var(--bads)}
.ch .zlab{font-size:15px;font-weight:800}
.ch .bl{font-size:15px;font-weight:800}
.ch .drag{cursor:grab}
.ch .fade{transition:opacity .4s}
.ch .hide{opacity:0}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
/* quiz */
.qz{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px 20px;border:1px solid #efe9dc}
.qz .qh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:14px;color:var(--mut);font-weight:700}
.qz .qh .qn{background:var(--ac);color:#fff;border-radius:8px;padding:0 10px}
.qz .qs{font-size:clamp(17px,1.8vw,21px);margin-bottom:8px}
.qz .op{display:flex;gap:10px;width:100%;text-align:right;background:#faf7f0;border:2px solid var(--line);border-radius:11px;padding:7px 12px;margin:6px 0;cursor:pointer;font-size:clamp(16px,1.7vw,19px)}
.qz .op:hover{border-color:var(--ink)}
.qz .op .ol{font-weight:800;min-width:1.2em}
.qz .op.ok{background:var(--oks);border-color:var(--ok)} .qz .op.no{background:var(--bads);border-color:var(--bad)} .qz .op.pick{box-shadow:0 0 0 3px rgba(22,33,58,.2)}
.qz .ex{margin-top:8px;border-top:2px solid var(--line);padding-top:8px;font-size:16px}
.qz .ex .tag{font-weight:800}
.qz .why{margin-top:8px}
.qz details summary{cursor:pointer;font-weight:700;color:var(--tc)}
.qz .formula,.qz .optx,.qz .calc,.qz .ans,.qz .key,.qz .tip{margin:5px 0}
.qz .formula{border-right:4px solid var(--tc);background:#eef2f9;padding:3px 10px;border-radius:6px}
.qz .formula .lab{font-weight:800;color:var(--tc)}
.qz .optx{display:flex;gap:8px;padding:3px 8px;border-radius:8px}
.qz .optx.ok{background:var(--oks)} .qz .optx .ol{font-weight:800}
.qz .ans{border:2px solid var(--ok);background:var(--oks);border-radius:8px;padding:2px 10px;font-weight:600}
.qz .calc{padding-right:10px}
.qz .key{font-weight:700}
.qz .tip{border-right:3px dashed var(--gold);padding-right:8px;font-size:15px}
.qz table.tb{border-collapse:collapse;margin:6px auto}.qz table.tb th,.qz table.tb td{border:1px solid var(--line);padding:2px 9px;text-align:center}
.qz figure.fig{margin:8px auto;text-align:center}.qz figure.fig svg{max-width:100%;height:auto}
.qz .figcap{font-size:14px;color:var(--mut)}
.qz .pt{flex:1}
/* drawers */
.drawer{position:fixed;top:0;bottom:0;width:min(420px,92vw);background:#fff;z-index:30;box-shadow:0 0 50px rgba(0,0,0,.25);padding:18px 20px;overflow:auto;transform:translateX(-110%);transition:transform .3s;visibility:hidden}
.drawer.right{right:0;left:auto;transform:translateX(110%)}
.drawer.left{left:0}
.drawer.open{transform:none;visibility:visible}
.drawer h3{margin:0 0 8px;font-size:22px}
.drawer .x{position:absolute;top:10px;left:12px;border:0;background:#eee;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px}
.drawer input[type=search]{width:100%;font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:10px;margin:8px 0}
.gl{border-bottom:1px solid var(--line);padding:8px 0;cursor:pointer}
.gl b{display:block}.gl span{color:var(--ink2);font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(22,33,58,.35);z-index:25;display:none}
.scrim.on{display:block}
.mi-list a{display:flex;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);align-items:center}
.mi-list a:hover,.mi-list a.cur{background:var(--ys)}
.mi-list a i{font-style:normal;font-weight:800;min-width:2em;color:var(--mut);direction:ltr;text-align:center}
.mi-list a.vis i{color:var(--ok)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:8px 18px;z-index:40;font-weight:700;animation:sin .3s both}
/* homework map */
.hwg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hwc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.hwc b{display:block}.hwc .tp{font-size:14px;color:var(--ink2)}
.hwc .go{margin-top:6px}
.hwc.flash{animation:flash 1.6s}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--gold)}100%{box-shadow:none}}
.lvl{font-size:12px;letter-spacing:1px;color:var(--y)}
/* print */
#printRoot{display:none}
@media print{
  @page{size:A4 landscape;margin:7mm}
  html,body{height:auto;background:#fff}
  #app,.drawer,.scrim,.toast{display:none!important}
  #printRoot{display:block}
  .pslide{width:1060px;height:714px;page-break-after:always;break-after:page;overflow:hidden;position:relative;padding:14px 22px;background:#fff;border:0}
  .pslide .pz{transform-origin:top right;width:1016px}
  .pslide .pfoot{position:absolute;bottom:4px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:11px;color:#777}
  .pslide .rv{position:static!important;visibility:visible!important;opacity:1!important;transform:none!important;height:auto!important;left:auto!important;margin:inherit!important;animation:none!important}
  .pslide .noprint,.pslide .ctl,.pslide .btn,.pslide .seg{display:none!important}
  .card,table.t,svg.ch,.qz,.fm{box-shadow:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pgl{page-break-after:always;break-after:page;padding:14px 22px;columns:2;font-size:13px}
}
.pslide .pz{pointer-events:none}
.sheet-print{display:none}
/* mobile */
@media(max-width:700px){
  body{font-size:16px}
  .bar{padding:6px 10px;gap:6px} .bar .ttl{font-size:13px}
  .ib kbd{display:none} .ib{padding:5px 8px}
  .slide{padding:14px 12px 100px}
  .foot .stephint{display:none}
}
.fsbody .bar{display:none}

.s05-leg{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;font-weight:700;font-size:16px}
.s05-lg i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-inline-end:4px}
.s05-lg.ok{color:var(--ok)} .s05-lg.ok i{background:var(--ok)}
.s05-lg.low{color:var(--low)} .s05-lg.low i{background:var(--low)}
.s05-lg.bad{color:var(--bad)} .s05-lg.bad i{background:var(--bad)}
.s05-rule{display:grid;gap:4px;font-size:18px;padding-inline-start:6px}
.s05-trk{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.s05-tk{border-radius:99px;padding:1px 12px;font-weight:700;font-size:15px;border:2px solid;opacity:.5;background:#fff}
.s05-tk.ok{border-color:var(--ok);color:var(--ok)} .s05-tk.low{border-color:var(--low);color:var(--low)} .s05-tk.bad{border-color:var(--bad);color:var(--bad)}
.s05-tk.got{opacity:1;color:#fff} .s05-tk.got.ok{background:var(--ok)} .s05-tk.got.low{background:var(--low)} .s05-tk.got.bad{background:var(--bad)}
.s05-tk.got::before{content:"✓ "}
.ok-c b,.fb b.ok-c{color:var(--ok)} .fb b.low-c{color:var(--low)} .fb b.bad-c{color:var(--bad)}
.s05-st .card{padding:8px 12px} .s05-st .card h3{font-size:16px;margin:0 0 3px} .s05-st .card div{font-size:15px;line-height:1.4}

.s06-rule{display:flex;gap:10px 26px;flex-wrap:wrap;font-size:18px;padding-inline-start:6px}
.s06-head{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:600;font-size:16px}
.s06-head b{font-size:19px} .s06-best{margin-inline-start:auto;color:var(--ink2)}
.s06-cand{font-size:22px;background:#fff8dc;border:2px solid var(--gold);border-radius:12px;padding:8px 14px}
.s06-opts{display:grid;gap:8px}
.s06-opt{display:block;width:100%;text-align:right;font-size:19px;padding:9px 14px}
.s06-opt.ok{border-color:var(--ok)} .s06-opt.low{border-color:var(--low)} .s06-opt.bad{border-color:var(--bad)}
.s06-opt.ok:hover:not(:disabled){background:var(--ok)} .s06-opt.low:hover:not(:disabled){background:var(--low)} .s06-opt.bad:hover:not(:disabled){background:var(--bad)}
.s06-opt:disabled{opacity:1;cursor:default}
.s06-opt:disabled:not(.right):not(.wrong){opacity:.45;background:#fff;color:var(--ink)}
.s06-opt.right,.s06-opt.right:hover{background:var(--oks);color:var(--ink);border-color:var(--ok);border-width:3px}
.s06-opt.wrong,.s06-opt.wrong:hover{background:var(--bads);color:var(--ink);border-color:var(--bad);border-width:3px}
.s06-ref table.t{font-size:15px} .s06-ref table.t th,.s06-ref table.t td{padding:3px 10px}
table.t.s06-pt{font-size:14px} table.t.s06-pt td{text-align:right;padding:4px 8px} table.t.s06-pt th{padding:5px 8px}
.s06-chs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
.s06-small{font-size:14px} .s06-small th,.s06-small td{padding:3px 10px}
.s06-xr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:4px 0}

/* ---- ppc.js ---- */
/* ===== PPC: math (course conventions) + SVG chart ===== */
const PPC = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const eps = 1e-9;
  const near = (a, b) => Math.abs(a - b) < 1e-7;
  /* number formatting: integers, clean decimals, simple fractions */
  function fmt(v, d = 4) {
    if (v === Infinity || isNaN(v)) return '∞';
    const r = Math.round(v * 10 ** d) / 10 ** d;
    return String(r === 0 ? 0 : r).replace('-', '−');
  }
  function frac(v) { // returns [n,d] when v is a simple fraction (d<=12), else null
    for (let d = 1; d <= 12; d++) { const n = Math.round(v * d); if (near(n / d, v)) return [n, d]; }

  }
  function fracStr(v) { const f = frac(v); if (!f) return fmt(v, 3); return f[1] === 1 ? String(f[0]).replace('-', '−') : f[0] + '/' + f[1]; }
  /* curve from vertices [[x,y],...] x ascending, y descending */
  function curve(pts) {
    const n = pts.length - 1;
    const C = { pts, xmax: pts[n][0], ymax: pts[0][1] };
    C.segs = []; for (let i = 0; i < n; i++) { const a = pts[i], b = pts[i + 1]; C.segs.push({ i, a, b, dx: b[0] - a[0], dy: a[1] - b[1], slope: (a[1] - b[1]) / (b[0] - a[0]) }); }
    C.yAt = x => { for (const s of C.segs) if (x >= s.a[0] - eps && x <= s.b[0] + eps) return s.a[1] - s.slope * (x - s.a[0]); return NaN; };
    C.xAt = y => { for (const s of C.segs) if (y <= s.a[1] + eps && y >= s.b[1] - eps) return s.a[0] + (s.a[1] - y) / s.slope; return NaN; };
    C.tcx = x => C.ymax - C.yAt(x);
    C.tcy = y => C.xmax - C.xAt(y);
    C.acx = x => x === 0 ? NaN : C.tcx(x) / x;
    C.acy = y => y === 0 ? NaN : C.tcy(y) / y;
    /* index of segment containing unit number x (x-th unit of x): left-closed on right end: a.x < x <= b.x */
    C.segX = x => { for (const s of C.segs) if (x > s.a[0] + eps && x <= s.b[0] + eps) return s.i; return -1; };
    /* unit number y of y: vertex belongs to the segment on its right: b.y < y <= a.y */
    C.segY = y => { for (const s of C.segs) if (y > s.b[1] + eps && y <= s.a[1] + eps) return s.i; return -1; };
    C.mcx = x => { const i = C.segX(x); return i < 0 ? NaN : C.segs[i].slope; };
    C.mcy = y => { const i = C.segY(y); return i < 0 ? NaN : 1 / C.segs[i].slope; };
    C.isVertexX = x => pts.some(p => near(p[0], x));
    C.isVertexY = y => pts.some(p => near(p[1], y));
    /* classify a combination vs the curve: 'ok' on curve, 'low' below, 'bad' above */
    C.zone = (x, y) => { if (x < -eps || y < -eps || x > C.xmax + eps) return 'bad'; const yc = C.yAt(Math.min(x, C.xmax)); if (near(y, yc)) return 'ok'; return y < yc ? 'low' : 'bad'; };
    C.straight = () => C.segs.every(s => near(s.slope, C.segs[0].slope));
    return C;
  }
  /* ---------- svg helpers ---------- */
  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);

    if (parent) parent.appendChild(e);

  function niceStep(max) { const raw = max / 6; const p = 10 ** Math.floor(Math.log10(raw)); const m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }

  /* ---------- chart ---------- */
  function chart(host, o = {}) {
    const W = o.w || 560, H = o.h || 400;
    const M = { l: o.ml || 58, r: 26, t: 26, b: 50 };
    const xmax = o.xmax, ymax = o.ymax;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'ch', role: 'img', 'aria-label': o.aria || 'גרף' });
    host.appendChild(svg);
    const sx = v => M.l + (W - M.l - M.r) * v / xmax;
    const sy = v => H - M.b - (H - M.t - M.b) * v / ymax;
    const dx = px => (px - M.l) / (W - M.l - M.r) * xmax;
    const dy = py => (H - M.b - py) / (H - M.t - M.b) * ymax;
    const L = {};
    ['grid', 'zones', 'axes', 'curve', 'ann', 'pts', 'top'].forEach(n => L[n] = el('g', { class: 'L-' + n }, svg));
    // arrow marker
    const defs = el('defs', null, svg);
    const mk = el('marker', { id: 'ar' + Math.random().toString(36).slice(2, 6), viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
    el('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#16213a' }, mk);
    const mid = mk.getAttribute('id');
    // grid + ticks
    const tx = o.ticksX || (() => { const st = niceStep(xmax); const a = []; for (let v = st; v < xmax * 0.98; v += st) a.push(v); return a; })();
    const ty = o.ticksY || (() => { const st = niceStep(ymax); const a = []; for (let v = st; v < ymax * 0.98; v += st) a.push(v); return a; })();

    el('line', { class: 'ax', x1: sx(0), y1: sy(0), x2: sx(0), y2: sy(ymax) - 14, 'marker-end': `url(#${mid})` }, L.axes);
    const tickEls = { x: {}, y: {} };
    function tick(axis, v, label) {

      else { const g = el('g', null, L.axes); el('line', { class: 'tick', x1: sx(0) - 5, y1: sy(v), x2: sx(0) + 5, y2: sy(v) }, g); el('text', { class: 'tl', x: sx(0) - 10, y: sy(v) + 5, 'text-anchor': 'end' }, g).textContent = label ?? fmt(v); tickEls.y[v] = g; }
    }
    if (o.showTicks !== false) { tx.forEach(v => tick('x', v)); ty.forEach(v => tick('y', v)); }
    el('text', { class: 'tl', x: sx(0) - 9, y: sy(0) + 19, 'text-anchor': 'end' }, L.axes).textContent = '0';
    if (o.xLabel) el('text', { class: 'al', x: sx(xmax) + 10, y: sy(0) + 42, 'text-anchor': 'end' }, L.axes).textContent = o.xLabel;
    if (o.yLabel) el('text', { class: 'al', x: sx(0) + 10, y: M.t - 8, 'text-anchor': 'start' }, L.axes).textContent = o.yLabel;

    const api = { svg, L, W, H, M, sx, sy, dx, dy, xmax, ymax, tick, tickEls };
    api.layer = n => L[n];
    api.clear = n => { while (L[n].firstChild) L[n].removeChild(L[n].firstChild); };
    api.line = (x1, y1, x2, y2, c = 'guide', layer = 'ann') => el('line', { class: c, x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2) }, L[layer]);
    api.text = (x, y, str, c = 'bl', anchor = 'middle', layer = 'ann', extra) => { const t = el('text', Object.assign({ class: c, x: sx(x), y: sy(y), 'text-anchor': anchor }, extra || {}), L[layer]); t.textContent = str; return t; };
    api.textPx = (px, py, str, c = 'bl', anchor = 'middle', layer = 'ann') => { const t = el('text', { class: c, x: px, y: py, 'text-anchor': anchor }, L[layer]); t.textContent = str; return t; };
    api.path = (pts, c = 'curve', layer = 'curve') => el('path', { class: c, d: 'M' + pts.map(p => sx(p[0]) + ',' + sy(p[1])).join(' L') }, L[layer]);
    /* curve with optional draw animation. returns path el */
    api.curve = (pts, opt = {}) => {
      const p = api.path(pts, 'curve' + (opt.cls ? ' ' + opt.cls : ''));
      if (opt.animate) {
        const len = p.getTotalLength(); p.style.setProperty('--len', len); p.style.setProperty('--dur', (opt.dur || 1.4) + 's'); p.classList.add('draw');

    };
    api.dot = (x, y, opt = {}) => {
      const g = el('g', { class: opt.pop ? 'pop' : '' }, L[opt.layer || 'pts']);
      const c = el('circle', { class: 'pt ' + (opt.cls || ''), cx: sx(x), cy: sy(y), r: opt.r || 7 }, g);
      let t = null;
      if (opt.label) {
        const pos = opt.pos || 'ne'; const off = (opt.r || 7) + 6;
        const ox = pos.includes('e') ? off : pos.includes('w') ? -off : 0, oy = pos.includes('n') ? -off : pos.includes('s') ? off + 10 : 5;
        t = el('text', { class: 'pl', x: sx(x) + ox, y: sy(y) + oy, 'text-anchor': ox > 0 ? 'start' : ox < 0 ? 'end' : 'middle' }, g); t.textContent = opt.label;
      }
      g.dot = c; g.lab = t; g.move = (nx, ny) => { c.setAttribute('cx', sx(nx)); c.setAttribute('cy', sy(ny)); if (t) { const pos = opt.pos || 'ne'; const off = (opt.r || 7) + 6; const ox = pos.includes('e') ? off : pos.includes('w') ? -off : 0, oy = pos.includes('n') ? -off : pos.includes('s') ? off + 10 : 5; t.setAttribute('x', sx(nx) + ox); t.setAttribute('y', sy(ny) + oy); } };
      return g;
    };

    api.vBracket = (x, y1, y2, label, cls = '', side = 1) => {
      const g = el('g', null, L.ann); const px = sx(x) + side * 14;
      el('path', { class: 'br ' + cls, d: `M${px - side * 6},${sy(y1)} L${px},${sy(y1)} L${px},${sy(y2)} L${px - side * 6},${sy(y2)}` }, g);
      if (label) { const t = el('text', { class: 'bl', x: px + side * 8, y: (sy(y1) + sy(y2)) / 2 + 5, 'text-anchor': side > 0 ? 'start' : 'end', fill: '' }, g); t.textContent = label; }

    };
    api.hBracket = (y, x1, x2, label, cls = '', side = -1) => {
      const g = el('g', null, L.ann); const py = sy(y) + side * 14;

      if (label) { const t = el('text', { class: 'bl', x: (sx(x1) + sx(x2)) / 2, y: py + side * 8 + (side > 0 ? 8 : 0), 'text-anchor': 'middle' }, g); t.textContent = label; }

    };
    /* zones relative to a curve: shade feasible region (below) and impossible (above) */
    api.zones = (C, opt = {}) => {
      api.clear('zones');
      const pts = C.pts;
      const below = 'M' + sx(0) + ',' + sy(0) + ' ' + pts.map(p => 'L' + sx(p[0]) + ',' + sy(p[1])).join(' ') + ' L' + sx(C.xmax) + ',' + sy(0) + ' Z';
      const above = 'M' + sx(0) + ',' + sy(ymax) + ' L' + sx(xmax) + ',' + sy(ymax) + ' L' + sx(xmax) + ',' + sy(0) + ' L' + sx(C.xmax) + ',' + sy(0) + ' ' + pts.slice().reverse().map(p => 'L' + sx(p[0]) + ',' + sy(p[1])).join(' ') + ' L' + sx(0) + ',' + sy(C.ymax) + ' Z';
      const a = el('path', { class: 'zone low fade', d: below }, L.zones), b = el('path', { class: 'zone bad fade', d: above }, L.zones);
      if (opt.labels !== false) { api.text(C.xmax * 0.2, C.ymax * 0.18, 'אפשרי אך לא יעיל', 'zlab', 'middle', 'zones').setAttribute('style', 'fill:#1d5fd1'); api.text(C.xmax * 0.78, Math.min(ymax * 0.93, C.ymax * 1.02), 'בלתי אפשרי', 'zlab', 'middle', 'zones').setAttribute('style', 'fill:#b01e2c'); }
      return { low: a, bad: b };
    };

    api.pointer = (ev) => { const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W, py = (ev.clientY - r.top) / r.height * H; return { x: dx(px), y: dy(py), px, py }; };

      let on = false;

})();

/* ---- core.js ---- */
/* ===== core: helpers, store, deck engine, glossary, print ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  const parts = spec.split('.'); const tag = parts.shift() || 'div';
  const e = document.createElement(tag); if (parts.length) e.className = parts.join(' ');
  if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs) || typeof attrs === 'string')) { kids.unshift(attrs); attrs = null; }
  if (attrs) for (const k in attrs) {
    const v = attrs[k]; if (v === undefined || v === null || v === false) continue;

/* ---------- store (localStorage with safe fallbacks) ---------- */

const MCQDATA={"1.9": {"id": "1.9", "set": "שאלות אמריקאיות א׳", "kind": "calc", "ans": "ג", "stem": "<p>במשק ״גליל״ מייצרים קפה (x) ועוגיות (y), בטונות. עקומת התמורה של המשק עוברת דרך הנקודות <span class=\"m\">(0, 60)</span>, <span class=\"m\">(20, 50)</span>, <span class=\"m\">(40, 30)</span> ו-<span class=\"m\">(60, 0)</span>, ומחוברת בקווים ישרים. איזה מהצירופים הבאים אפשרי אך לא יעיל?</p>", "opts": [{"l": "א", "h": "<span class=\"m\">(10, 60)</span>"}, {"l": "ב", "h": "<span class=\"m\">(20, 50)</span>"}, {"l": "ג", "h": "<span class=\"m\">(30, 35)</span>"}, {"l": "ד", "h": "<span class=\"m\">(50, 20)</span>"}, {"l": "ה", "h": "<span class=\"m\">(60, 10)</span>"}], "shared": "<div class=\"key\">השאלה בודקת איפה כל צירוף נמצא ביחס לעקומה. הכלי: משווים את y שבצירוף ל-y המקסימלי שהעקומה נותנת באותו x.</div>\n<div class=\"formula\"><span class=\"lab\">כלל:</span> באותו x: y שבצירוף קטן מ-y של העקומה, הצירוף מתחת לעקומה (אפשרי ולא יעיל). שווה, על העקומה (יעיל). גדול, מעל העקומה (בלתי אפשרי).</div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">m = ΔY / ΔX</span> ו-<span class=\"m\">y = y1 − (x − x1) × m</span> (שיפוע בערך מוחלט, בקטע שבו נמצא x)</div>\n<div class=\"calc\">הצבה בקטע הראשון, מ-<span class=\"m\">(0, 60)</span> עד <span class=\"m\">(20, 50)</span>: <span class=\"m\">m = (60 − 50) / (20 − 0) = 0.5</span></div>\n<div class=\"calc\">הצבה ב-<span class=\"m\">x = 10</span>: <span class=\"m\">y = 60 − (10 − 0) × 0.5 = 55</span></div>\n<div class=\"calc\">הצבה בקטע השני, מ-<span class=\"m\">(20, 50)</span> עד <span class=\"m\">(40, 30)</span>: <span class=\"m\">m = (50 − 30) / (40 − 20) = 1</span></div>\n<div class=\"calc\">הצבה ב-<span class=\"m\">x = 30</span>: <span class=\"m\">y = 50 − (30 − 20) × 1 = 40</span></div>\n<div class=\"calc\">הצבה בקטע השלישי, מ-<span class=\"m\">(40, 30)</span> עד <span class=\"m\">(60, 0)</span>: <span class=\"m\">m = (30 − 0) / (60 − 40) = 1.5</span></div>\n<div class=\"calc\">הצבה ב-<span class=\"m\">x = 50</span>: <span class=\"m\">y = 30 − (50 − 40) × 1.5 = 15</span></div>\n<figure class=\"fig\"><svg class=\"plot\" viewBox=\"0 0 300 210\" width=\"300\" height=\"210\" xmlns=\"http://www.w3.org/2000/svg\" direction=\"ltr\" font-family=\"David Libre, Liberation Serif, serif\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/></marker><pattern id=\"hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#777\" stroke-width=\"1\"/></pattern></defs><line x1=\"44.0\" y1=\"170.0\" x2=\"294.0\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"44.0\" y1=\"170.0\" x2=\"44.0\" y2=\"6.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"110.9\" y1=\"167.0\" x2=\"110.9\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"110.9\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">20</text><line x1=\"177.7\" y1=\"167.0\" x2=\"177.7\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"177.7\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">40</text><line x1=\"244.6\" y1=\"167.0\" x2=\"244.6\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"244.6\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">60</text><line x1=\"41.0\" y1=\"108.3\" x2=\"47.0\" y2=\"108.3\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"111.8\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">30</text><line x1=\"41.0\" y1=\"67.1\" x2=\"47.0\" y2=\"67.1\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"70.6\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">50</text><l nicode-bidi:isolate\">ד</text><path d=\"M240.6,145.4 l8,8 M240.6,153.4 l8,-8\" stroke=\"#000\" stroke-width=\"1.8\" fill=\"none\"/><text x=\"251.6\" y=\"142.4\" text-anchor=\"end\" font-size=\"12\" font-weight=\"700\" direction=\"rtl\" style=\"unicode-bidi:isolate\">ה</text></svg><div class=\"figcap\">העקומה וחמשת הצירופים (איקס = צירוף שבשאלה, האות = האפשרות)</div></figure>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> ג: הצירוף <span class=\"m\">(30, 35)</span> נמצא מתחת לעקומה (המקסימום ב-<span class=\"m\">x = 30</span> הוא 40), ולכן הוא אפשרי אך לא יעיל.</div>", "per": {"א": "<span class=\"m\">(10, 60)</span>. ב-<span class=\"m\">x = 10</span> העקומה מאפשרת לכל היותר 55 (חישוב בקטע הראשון), והצירוף כולל 60. מי שבחר בה ראה ש-60 הוא <span class=\"m\">Ymax</span> והניח שאפשר לשמור עליו גם כשמייצרים קפה. 60 גדול מ-55, לכן הצירוף מעל העקומה ובלתי אפשרי.", "ב": "<span class=\"m\">(20, 50)</span>. זו אחת מנקודות הנתונים, ולכן היא על העקומה: אפשרית ויעילה. השאלה מבקשת צירוף אפשרי שאינו יעיל, כלומר מתחת לעקומה, ולכן הנקודה שעל העקומה אינה מתאימה.", "ג": "<span class=\"m\">(30, 35)</span>. ב-<span class=\"m\">x = 30</span> אפשר לייצר עד 40 טון עוגיות (חישוב בקטע השני), והצירוף כולל 35 בלבד. <span class=\"m\">40 − 35 = 5</span>: אפשר להוסיף 5 טון עוגיות בלי לוותר על קפה, ולכן הצירוף מתחת לעקומה, אפשרי ולא יעיל.", "ד": "<span class=\"m\">(50, 20)</span>. מי שבחר בה המשיך להשתמש בשיפוע הקטע השני (1) גם אחרי <span class=\"m\">x = 40</span>: <span class=\"m\">30 − (50 − 40) × 1 = 20</span>. אבל מ-<span class=\"m\">x = 40</span> השיפוע הוא 1.5 והמקסימום ב-<span class=\"m\">x = 50</span> הוא 15. הצירוף כולל 20, גדול מ-15, ולכן הוא מעל העקומה ובלתי אפשרי.", "ה": "<span class=\"m\">(60, 10)</span>. ב-<span class=\"m\">x = 60</span> כל המשאבים מופנים לקפה, והמקסימום של עוגיות הוא 0 (הנקודה <span class=\"m\">(60, 0)</span>). הצירוף כולל 10, ולכן הוא מעל העקומה ובלתי אפשרי."}}, "1.10": {"id": "1.10", "set": "שאלות אמריקאיות א׳", "kind": "concept", "ans": "א", "stem": "<p>איזו מהטענות הבאות נכונה לגבי עקומת תמורה?</p>", "opts": [{"l": "א", "h": "נקודה מתחת לעקומה היא אפשרית, אך אינה יעילה."}, {"l": "ב", "h": "נקודה מעל העקומה יעילה אם המשק מנצל את כל משאביו."}, {"l": "ג", "h": "נקודה על העקומה היא הצירוף היחיד שהמשק יכול לייצר."}, {"l": "ד", "h": "כל נקודה שמתחת לעקומה היא בלתי אפשרית."}, {"l": "ה", "h": "העקומה מציגה את כל הצירופים הבלתי אפשריים."}], "shared": "<div class=\"formula\"><span class=\"lab\">כלל:</span> נקודה על העקומה: יעילה. נקודה מתחת לעקומה: אפשרית אך לא יעילה. נקודה מעל העקומה: בלתי אפשרית.</div>\n<div class=\"key\">העקומה מציגה את הייצור המקסימלי כשכל המשאבים מנוצלים. כל צירוף בשטח שמתחתיה אפשרי, אבל אפשר להגדיל בו ייצור של מוצר אחד בלי לוותר על האחר, ולכן הוא לא יעיל.</div>\n<figure class=\"fig\"><svg class=\"plot\" viewBox=\"0 0 280 200\" width=\"280\" height=\"200\" xmlns=\"http://www.w3.org/2000/svg\" direction=\"ltr\" font-family=\"David Libre, Liberation Serif, serif\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/></marker><pattern id=\"hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#777\" stroke-width=\"1\"/></pattern></defs><line x1=\"44.0\" y1=\"160.0\" x2=\"274.0\" y2=\"160.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"44.0\" y1=\"160.0\" x2=\"44.0\" y2=\"6.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><text x=\"39.0\" y=\"174.0\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">0</text><text x=\"272.0\" y=\"194.0\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" direction=\"ltr\" style=\"unicode-bidi:isolate\">x</text><text x=\"52.0\" y=\"13.0\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" direction=\"ltr\" style=\"unicode-bidi:isolate\">y</text><polyline points=\"44.0,45.1 105.1,64.3 166.3,102.6 227.4,160.0\" stroke=\"#000\" stroke-width=\"1.6\" fill=\"none\" stroke-linejoin=\"round\"/><circle cx=\"44.0\" cy=\"45.1\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"105.1\" cy=\"64.3\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"166.3\" cy=\"102.6\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"227.4\" cy=\"160.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"71.3\" y=\"129.5\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">אפשרי ולא יעיל</text><text x=\"163.1\" y=\"53.0\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">בלתי אפשרי</text><text x=\"185.5\" y=\"89.8\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">יעיל (על העקומה)</text></svg><div class=\"figcap\">שלושת האזורים ביחס לעקומה</div></figure>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> א: נקודה מתחת לעקומה היא אפשרית, אך אינה יעילה.</div>", "per": {"א": "המשק יכול לייצר כל צירוף שמתחת לעקומה, כי הוא מייצר פחות ממה שהמשאבים מאפשרים. הצירוף אינו יעיל, כי אפשר להגדיל ייצור בלי לוותר על דבר. בשרטוט: <span class=\"m\">(30, 35)</span> נמצא מתחת ל-<span class=\"m\">(30, 40)</span> שעל העקומה, ואפשר להוסיף 5 יחידות y בלי לגרוע מ-x.", "ב": "נקודה מעל העקומה בלתי אפשרית, גם אם המשק מנצל את כל משאביו. העקומה כבר מציגה את מה שמתקבל בניצול מלא. בשרטוט: <span class=\"m\">(30, 45)</span> מעל <span class=\"m\">(30, 40)</span>, ולכן אי אפשר לייצר אותו. מי שבחר בה בלבל בין יעילות לאפשרות.", "ג": "המשק יכול לבחור גם צירופים מתחת לעקומה, למשל <span class=\"m\">(10, 10)</span> או אפילו <span class=\"m\">(0, 0)</span>. העקומה היא רק קבוצת הצירופים היעילים, לא הצירוף היחיד ולא כל האפשרויות.", "ד": "הפכו בין האזורים. הצירוף <span class=\"m\">(20, 20)</span> נמצא מתחת לעקומה (ב-<span class=\"m\">x = 20</span> העקומה מאפשרת 50) והוא אפשרי לגמרי. בלתי אפשריים הם הצירופים שמעל העקומה.", "ה": "העקומה כוללת צירופים אפשריים ויעילים, כמו <span class=\"m\">(20, 50)</span> ו-<span class=\"m\">(40, 30)</span>, ולא צירופים בלתי אפשריים. הצירופים הבלתי אפשריים נמצאים מעליה. העקומה היא הגבול בין האפשרי לבלתי אפשרי."}}, "1.11": {"id": "1.11", "set": "שאלות אמריקאיות א׳", "kind": "calc", "ans": "ב", "stem": "<p>עקומת התמורה של מפעל ״ברק״ עוברת דרך הנקודות <span class=\"m\">(0, 120)</span>, <span class=\"m\">(40, 100)</span>, <span class=\"m\">(100, 40)</span> ו-<span class=\"m\">(120, 0)</span>, ומחוברת בקווים ישרים. x הוא מספר אלפי המכשירים מסוג א, ו-y הוא מספר אלפי המכשירים מסוג ב. מהי העלות הממוצעת לייצור y בנקודה <span class=\"m\">(100, 40)</span>?</p>", "opts": [{"l": "א", "h": "0.2"}, {"l": "ב", "h": "0.5"}, {"l": "ג", "h": "0.8"}, {"l": "ד", "h": "2"}, {"l": "ה", "h": "20"}], "shared": "<div class=\"key\">מבקשים עלות ממוצעת של y בנקודה. בייצור y מוותרים על x, ולכן העלות מבוטאת במונחי x.</div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">TC(y) = Xmax − X</span> ואחר כך <span class=\"m\">AC(y) = TC(y) / Y</span> (העלות הכוללת חלקי הכמות של y בנקודה)</div>\n<div class=\"calc\">הצבה בנקודה <span class=\"m\">(100, 40)</span>, כש-<span class=\"m\">Xmax = 120</span>: <span class=\"m\">TC(y) = 120 − 100 = 20</span></div>\n<div class=\"calc\">הצבה: <span class=\"m\">AC(y) = 20 / 40 = 0.5</span></div>\n<figure class=\"fig\"><svg class=\"plot\" viewBox=\"0 0 300 210\" width=\"300\" height=\"210\" xmlns=\"http://www.w3.org/2000/svg\" direction=\"ltr\" font-family=\"David Libre, Liberation Serif, serif\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/></marker><pattern id=\"hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#777\" stroke-width=\"1\"/></pattern></defs><line x1=\"44.0\" y1=\"170.0\" x2=\"294.0\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"44.0\" y1=\"170.0\" x2=\"44.0\" y2=\"6.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"113.3\" y1=\"167.0\" x2=\"113.3\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"113.3\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">40</text><line x1=\"217.3\" y1=\"167.0\" x2=\"217.3\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"217.3\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">100</text><line x1=\"252.0\" y1=\"167.0\" x2=\"252.0\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"252.0\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">120</text><line x1=\"41.0\" y1=\"127.3\" x2=\"47.0\" y2=\"127.3\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"130.8\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">40</text><line x1=\"41.0\" y1=\"42.0\" x2=\"47.0\" y2=\"42.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"45.5\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">120</text><text x=\"39.0\" y=\"184.0\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">0</text><text x=\"292.0\" y=\"204.0\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" direction=\"rtl\" style=\"unicode-bidi:isolate\">מכשירים א</text><text x=\"52.0\" y=\"13.0\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" direction=\"rtl\" style=\"unicode-bidi:isolate\">מכשירים ב</text><polyline points=\"44.0,42.0 113.3,63.3 217.3,127.3 252.0,170.0\" stroke=\"#000\" stroke-width=\"1.6\" fill=\"none\" stroke-linejoin=\"round\"/><line x1=\"217.3\" y1=\"127.3\" x2=\"217.3\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"217.3\" y1=\"127.3\" x2=\"44.0\" y2=\"127.3\" stroke=\"#000\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"217.3\" y1=\"170.0\" x2=\"252.0\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"2.4\" fill=\"none\"/><line x1=\"44.0\" y1=\"127.3\" x2=\"44.0\" y2=\"42.0\" stroke=\"#000\" stroke-width=\"2.4\" fill=\"none\"/><circle cx=\"44.0\" cy=\"42.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"113.3\" cy=\"63.3\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"217.3\" cy=\"127.3\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"224.3\" y=\"120.3\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" direction=\"ltr\" style=\"unicode-bidi:isolate\">(100,40)</text><circle cx=\"252.0\" cy=\"170.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"231.3\" y=\"139.5\" text-anchor=\"start\" font-size=\"11\" direction=\"ltr\" style=\"unicode-bidi:isolate\">TC(y)=20</text><text x=\"58.2\" y=\"83.3\" text-anchor=\"start\" font-size=\"11\" direction=\"ltr\" style=\"unicode-bidi:isolate\">TC(x)=80</text></svg><div class=\"figcap\">העלות הכוללת של y היא הקטע על ציר x, והעלות הכוללת של x היא הקטע על ציר y</div></figure>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> ב: <span class=\"m\">0.5</span> (אלפי מכשירים מסוג א לכל אלף מכשירים מסוג ב).</div>", "per": {"א": "<span class=\"m\">0.2</span>. מי שבחר בה חילק את העלות הכוללת בכמות של x ולא של y: <span class=\"m\">20 / 100 = 0.2</span>. לפי <span class=\"m\">AC(y) = TC(y) / Y</span> המכנה הוא כמות y בנקודה, כלומר 40.", "ב": "<span class=\"m\">0.5</span>. <span class=\"m\">AC(y) = TC(y) / Y = 20 / 40 = 0.5</span>. בממוצע מוותרים על חצי אלף מכשירים מסוג א על כל אלף מכשירים מסוג ב.", "ג": "<span class=\"m\">0.8</span>. מי שבחר בה חישב עלות ממוצעת של x: <span class=\"m\">TC(x) = Ymax − Y = 120 − 40 = 80</span> ו-<span class=\"m\">AC(x) = 80 / 100 = 0.8</span>. זה הויתור על y ליחידת x, והשאלה מבקשת את העלות של y.", "ד": "<span class=\"m\">2</span>. מי שבחר בה הפך את היחס: <span class=\"m\">Y / TC(y) = 40 / 20 = 2</span>. עלות ממוצעת היא עלות חלקי כמות, ולא כמות חלקי עלות.", "ה": "<span class=\"m\">20</span>. מי שבחר בה עצר אחרי העלות הכוללת <span class=\"m\">TC(y) = 120 − 100 = 20</span> ושכח לחלק בכמות של y. זו עלות כוללת של 40 אלף מכשירים, לא העלות ליחידה."}}, "1.12": {"id": "1.12", "set": "שאלות אמריקאיות א׳", "kind": "concept", "ans": "ד", "stem": "<p>בעקומת תמורה נתונה, מהי העלות הממוצעת לייצור y בנקודה שבה כמות ה-y היא אפס?</p>", "opts": [{"l": "א", "h": "אפס"}, {"l": "ב", "h": "אחד"}, {"l": "ג", "h": "שווה לעלות השולית של היחידה הראשונה"}, {"l": "ד", "h": "חסרת משמעות, כי מחלקים באפס"}, {"l": "ה", "h": "שווה ל-Xmax"}], "shared": "<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">AC(y) = TC(y) / Y</span> (העלות הכוללת חלקי הכמות של y בנקודה)</div>\n<div class=\"calc\">הצבה בנקודה שבה אין ייצור של y, <span class=\"m\">(Xmax, 0)</span>: <span class=\"m\">TC(y) = Xmax − X = Xmax − Xmax = 0</span>, ולכן <span class=\"m\">AC(y) = 0 / 0</span></div>\n<div class=\"formula\"><span class=\"lab\">כלל:</span> אי אפשר לחלק באפס. כשהכמות בנקודה היא אפס, העלות הממוצעת חסרת משמעות.</div>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> ד: חסרת משמעות, כי מחלקים באפס.</div>", "per": {"א": "אפס. מי שבחר בה ראה שהעלות הכוללת היא אפס והסיק שגם הממוצעת אפס, כאילו <span class=\"m\">0 / 5 = 0</span>. אבל כאן גם המכנה הוא אפס, וחילוק באפס אינו מוגדר.", "ב": "אחד. מי שבחר בה חשב שמספר חלקי עצמו נותן 1, כמו <span class=\"m\">5 / 5 = 1</span>. זה נכון רק למספר שונה מאפס. את <span class=\"m\">0 / 0</span> אפשר לפרש כאפס, כאחד או ככל ערך אחר, ולכן אין לו ערך.", "ג": "שווה לעלות השולית של היחידה הראשונה. העלות השולית כן קיימת ומחושבת מהקטע הראשון, <span class=\"m\">MC(y) = ΔX / ΔY</span>, אבל היא עלות של יחידה אחת. עלות ממוצעת היא עלות כוללת חלקי כמות בנקודה, ובנקודה ללא ייצור אין כמות לחלק בה.", "ד": "חסרת משמעות, כי מחלקים באפס. הצבה בנקודה נותנת <span class=\"m\">0 / 0</span>, ביטוי שאינו מוגדר.", "ה": "שווה ל-<span class=\"m\">Xmax</span>. <span class=\"m\">Xmax</span> הוא נקודת החיתוך עם ציר x, כמות של x ולא עלות ממוצעת. בנקודה <span class=\"m\">(Xmax, 0)</span> אפילו העלות הכוללת של y היא <span class=\"m\">Xmax − Xmax = 0</span>."}}, "1.13": {"id": "1.13", "set": "שאלות אמריקאיות ב׳", "kind": "calc", "ans": "ה", "stem": "<p>עקומת התמורה של משק ״דרור״ עוברת דרך הנקודות <span class=\"m\">(0, 90)</span>, <span class=\"m\">(30, 80)</span>, <span class=\"m\">(70, 30)</span> ו-<span class=\"m\">(90, 0)</span>, ומחוברת בקווים ישרים. x הוא ייצור חיטה, y הוא ייצור שעורה, בטונות. מהי העלות השולית לייצור הטון ה-70 של חיטה?</p>", "opts": [{"l": "א", "h": "<span class=\"m\">1/3</span>"}, {"l": "ב", "h": "<span class=\"m\">6/7</span>"}, {"l": "ג", "h": "1.5"}, {"l": "ד", "h": "60"}, {"l": "ה", "h": "כל התשובות שגויות"}], "shared": "<div class=\"key\">מבקשים עלות שולית של x ביחידה ה-70, שנמצאת בדיוק בנקודת שבר. העלות השולית של יחידה היא שיפוע הקטע שבו היא נמצאת.</div>\n<div class=\"formula\"><span class=\"lab\">כלל:</span> עלות שולית בנקודת שבר: שיפוע הקטע שמשמאל לנקודה, כי היחידה ה-70 היא האחרונה שמביאה אל הנקודה.</div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">MC(x) = ΔY / ΔX</span> (שיפוע בערך מוחלט)</div>\n<div class=\"calc\">הצבה בקטע מ-<span class=\"m\">(30, 80)</span> עד <span class=\"m\">(70, 30)</span>: <span class=\"m\">MC(x) = (80 − 30) / (70 − 30) = 50 / 40 = 1.25</span></div>\n<figure class=\"fig\"><svg class=\"plot\" viewBox=\"0 0 300 210\" width=\"300\" height=\"210\" xmlns=\"http://www.w3.org/2000/svg\" direction=\"ltr\" font-family=\"David Libre, Liberation Serif, serif\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/></marker><pattern id=\"hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#777\" stroke-width=\"1\"/></pattern></defs><line x1=\"44.0\" y1=\"170.0\" x2=\"294.0\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"44.0\" y1=\"170.0\" x2=\"44.0\" y2=\"6.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"114.2\" y1=\"167.0\" x2=\"114.2\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"114.2\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">30</text><line x1=\"207.8\" y1=\"167.0\" x2=\"207.8\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"207.8\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">70</text><line x1=\"254.6\" y1=\"167.0\" x2=\"254.6\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"254.6\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">90</text><line x1=\"41.0\" y1=\"126.8\" x2=\"47.0\" y2=\"126.8\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"130.3\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">30</text><line x1=\"41.0\" y1=\"54.8\" x2=\"47.0\" y2=\"54.8\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"58.3\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">80</text><line x1=\"41.0\" y1=\"40.4\" x2=\"47.0\" y2=\"40.4\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"43.9\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">90</text><text x=\"39.0\" y=\"184.0\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">0</text><text x=\"292.0\" y=\"204.0\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" direction=\"rtl\" style=\"unicode-bidi:isolate\">חיטה</text><text x=\"52.0\" y=\"13.0\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" direction=\"rtl\" style=\"unicode-bidi:isolate\">שעורה</text><polyline points=\"44.0,40.4 114.2,54.8 207.8,126.8 254.6,170.0\" stroke=\"#000\" stroke-width=\"1.6\" fill=\"none\" stroke-linejoin=\"round\"/><line x1=\"207.8\" y1=\"126.8\" x2=\"207.8\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><circle cx=\"44.0\" cy=\"40.4\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"114.2\" cy=\"54.8\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"207.8\" cy=\"126.8\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"214.8\" y=\"119.8\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" direction=\"ltr\" style=\"unicode-bidi:isolate\">(70,30)</text><circle cx=\"254.6\" cy=\"170.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"71.7\" y=\"37.2\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">שיפוע 1/3</text><text x=\"163.3\" y=\"79.5\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">שיפוע 1.25</text><text x=\"233.5\" y=\"137.1\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">שיפוע 1.5</text></svg><div class=\"figcap\">המספרים על הקטעים הם השיפועים בערך מוחלט. היחידה ה-70 בסוף הקטע האמצעי</div></figure>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> ה: כל התשובות שגויות. העלות השולית היא 1.25, והיא אינה מופיעה באפשרויות א עד ד.</div>", "per": {"א": "<span class=\"m\">1/3</span>. זה שיפוע הקטע הראשון: <span class=\"m\">(90 − 80) / (30 − 0) = 10 / 30 = 1/3</span>. הקטע הזה נמצא רחוק מהטון ה-70, ולכן אינו רלוונטי.", "ב": "<span class=\"m\">6/7</span>. מי שבחר בה חישב עלות ממוצעת: <span class=\"m\">TC(x) = Ymax − Y = 90 − 30 = 60</span> ו-<span class=\"m\">AC(x) = 60 / 70 = 6/7</span>. השאלה מבקשת עלות שולית של יחידה אחת, לא ממוצע על כל 70 הטונות.", "ג": "<span class=\"m\">1.5</span>. זה שיפוע הקטע שמימין לנקודה: <span class=\"m\">(30 − 0) / (90 − 70) = 30 / 20 = 1.5</span>. בנקודת שבר של x משתמשים בקטע שמשמאל, כי הטון ה-70 הוא האחרון בקטע האמצעי. הטון ה-71 כבר בקטע הימני.", "ד": "<span class=\"m\">60</span>. מי שבחר בה נתן את העלות הכוללת בנקודה: <span class=\"m\">TC(x) = 90 − 30 = 60</span>. זו עלות של 70 טונות, לא של טון אחד.", "ה": "כל התשובות שגויות. הערך הנכון, <span class=\"m\">1.25</span>, שונה מכל הערכים באפשרויות א עד ד, ולכן זו התשובה הנכונה."}}, "1.14": {"id": "1.14", "set": "שאלות אמריקאיות ב׳", "kind": "calc", "ans": "ג", "stem": "<p>עקומת התמורה של חווה מורכבת מהנקודות <span class=\"m\">(0, 80)</span>, <span class=\"m\">(20, 70)</span>, <span class=\"m\">(60, 30)</span> ו-<span class=\"m\">(80, 0)</span>, ומחוברת בקווים ישרים. x הוא ייצור ירקות ו-y הוא ייצור פירות, בטונות. בכמה יקטן ייצור הפירות אם ייצור הירקות יגדל מ-10 ל-50 טונות, והחווה נשארת על העקומה?</p>", "opts": [{"l": "א", "h": "20"}, {"l": "ב", "h": "25"}, {"l": "ג", "h": "35"}, {"l": "ד", "h": "40"}, {"l": "ה", "h": "60"}], "shared": "<div class=\"key\">כשהמעבר מ-10 ל-50 חוצה נקודת שבר (<span class=\"m\">x = 20</span>), מחשבים כל קטע בנפרד ומסכמים את הירידה ב-y.</div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">m = ΔY / ΔX</span> ו-<span class=\"m\">ΔY = ΔX × m</span> לכל קטע, ואחר כך סכום</div>\n<div class=\"calc\">הצבה בקטע הראשון: <span class=\"m\">m = (80 − 70) / (20 − 0) = 0.5</span></div>\n<div class=\"calc\">הצבה בקטע השני: <span class=\"m\">m = (70 − 30) / (60 − 20) = 1</span></div>\n<div class=\"calc\">הצבה בקטע השלישי: <span class=\"m\">m = (30 − 0) / (80 − 60) = 1.5</span></div>\n<div class=\"calc\">הצבה בקטע הראשון (מ-10 עד 20): <span class=\"m\">ΔY = (20 − 10) × 0.5 = 5</span></div>\n<div class=\"calc\">הצבה בקטע השני (מ-20 עד 50): <span class=\"m\">ΔY = (50 − 20) × 1 = 30</span></div>\n<div class=\"calc\">סך הכל: <span class=\"m\">5 + 30 = 35</span></div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> בדיקה לפי <span class=\"m\">y = y1 − (x − x1) × m</span></div>\n<div class=\"calc\">הצבה ב-<span class=\"m\">x = 10</span>: <span class=\"m\">y = 80 − (10 − 0) × 0.5 = 75</span></div>\n<div class=\"calc\">הצבה ב-<span class=\"m\">x = 50</span>: <span class=\"m\">y = 70 − (50 − 20) × 1 = 40</span></div>\n<div class=\"calc\">הירידה: <span class=\"m\">75 − 40 = 35</span></div>\n<figure class=\"fig\"><svg class=\"plot\" viewBox=\"0 0 300 210\" width=\"300\" height=\"210\" xmlns=\"http://www.w3.org/2000/svg\" direction=\"ltr\" font-family=\"David Libre, Liberation Serif, serif\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/></marker><pattern id=\"hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#777\" stroke-width=\"1\"/></pattern></defs><line x1=\"44.0\" y1=\"170.0\" x2=\"294.0\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"44.0\" y1=\"170.0\" x2=\"44.0\" y2=\"6.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"70.0\" y1=\"167.0\" x2=\"70.0\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"70.0\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">10</text><line x1=\"96.0\" y1=\"167.0\" x2=\"96.0\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"96.0\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">20</text><line x1=\"174.0\" y1=\"167.0\" x2=\"174.0\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"174.0\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">50</text><line x1=\"41.0\" y1=\"106.0\" x2=\"47.0\" y2=\"106.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"109.5\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">40</text><line x1=\"41.0\" y1=\"50.0\" x .0\" stroke=\"#000\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"200.0\" y1=\"104.5\" x2=\"44.0\" y2=\"104.5\" stroke=\"#000\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><circle cx=\"44.0\" cy=\"39.1\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"148.0\" cy=\"65.3\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"200.0\" cy=\"104.5\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"207.0\" y=\"97.5\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" direction=\"ltr\" style=\"unicode-bidi:isolate\">(60,50)</text><circle cx=\"252.0\" cy=\"170.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"66.6\" y=\"37.3\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">שיפוע 0.5</text><text x=\"191.4\" y=\"76.6\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">שיפוע 1.5</text><text x=\"222.6\" y=\"134.2\" text-anchor=\"end\" font-size=\"11\" direction=\"rtl\" style=\"unicode-bidi:isolate\">שיפוע 2.5</text></svg><div class=\"figcap\">המספרים על הקטעים הם השיפועים בערך מוחלט. היחידה ה-50 של y בקטע הימני</div></figure>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> א: <span class=\"m\">0.4</span> (אלפי כסאות לכל אלף שולחנות).</div>", "per": {"א": "<span class=\"m\">0.4</span>. <span class=\"m\">MC(y) = ΔX / ΔY = 20 / 50 = 0.4</span>, בקטע שמימין לנקודה. כל שולחן נוסף בקטע הזה עולה 0.4 כסאות.", "ב": "<span class=\"m\">2/3</span>. מי שבחר בה השתמש בקטע שמשמאל לנקודה: <span class=\"m\">MC(y) = (60 − 40) / (80 − 50) = 20 / 30 = 2/3</span>. החישוב נכון לקטע ההוא, אבל בנקודת שבר של y משתמשים בקטע שמימין.", "ג": "<span class=\"m\">1.5</span>. זה שיפוע הקטע השמאלי, <span class=\"m\">30 / 20 = 1.5</span>, בלי להפוך. השיפוע הוא העלות השולית של x (ויתור על y ליחידת x), ולא של y.", "ד": "<span class=\"m\">2.5</span>. זה שיפוע הקטע הנכון, <span class=\"m\">50 / 20 = 2.5</span>, אבל בלי להפוך. העלות של y במונחי x היא ההופכי: <span class=\"m\">1 / 2.5 = 0.4</span>.", "ה": "<span class=\"m\">20</span>. זו העלות הכוללת של y בנקודה: <span class=\"m\">TC(y) = Xmax − X = 80 − 60 = 20</span>. היא מתייחסת ל-50 אלף שולחנות, ולא ליחידה אחת."}}, "1.17": {"id": "1.17", "set": "שאלות אמריקאיות ג׳", "kind": "calc", "ans": "ד", "stem": "<p>עקומת התמורה של מאפיית ״פתיל״ עוברת דרך הנקודות <span class=\"m\">(0, 120)</span>, <span class=\"m\">(40, 100)</span>, <span class=\"m\">(60, 80)</span> ו-<span class=\"m\">(100, 0)</span>, ומחוברת בקווים ישרים. x הוא ייצור לחם ו-y הוא ייצור עוגות, בטונות. מהי העלות הכוללת לייצור 50 טונות לחם, כשהמאפייה נמצאת על העקומה?</p>", "opts": [{"l": "א", "h": "0.6"}, {"l": "ב", "h": "20"}, {"l": "ג", "h": "25"}, {"l": "ד", "h": "30"}, {"l": "ה", "h": "90"}], "shared": "<div class=\"key\">מבקשים עלות כוללת בנקודה שלא ניתנה: <span class=\"m\">x = 50</span> אינו אחד מנתוני העקומה, ולכן קודם מוצאים את y של העקומה באותו x.</div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">m = ΔY / ΔX</span>, <span class=\"m\">y = y1 − (x − x1) × m</span> ו-<span class=\"m\">TC(x) = Ymax − Y</span></div>\n<div class=\"calc\">הצבה: <span class=\"m\">x = 50</span> נמצא בקטע בין <span class=\"m\">(40, 100)</span> ל-<span class=\"m\">(60, 80)</span>, ששיפועו <span class=\"m\">m = (100 − 80) / (60 − 40) = 1</span></div>\n<div class=\"calc\">הצבה: <span class=\"m\">y = 100 − (50 − 40) × 1 = 90</span></div>\n<div class=\"calc\">הצבה: <span class=\"m\">TC(x) = 120 − 90 = 30</span></div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> בדיקה: העלות הכוללת היא סכום ה-<span class=\"m\">ΔY</span> של הקטעים, <span class=\"m\">ΔY = ΔX × m</span></div>\n<div class=\"calc\">הצבה בקטע הראשון (מ-0 עד 40): <span class=\"m\">m = (120 − 100) / (40 − 0) = 0.5</span>, ו-<span class=\"m\">ΔY = 40 × 0.5 = 20</span></div>\n<div class=\"calc\">הצבה בקטע השני (מ-40 עד 50): <span class=\"m\">ΔY = 10 × 1 = 10</span>, ובסך הכל <span class=\"m\">TC(x) = 20 + 10 = 30</span></div>\n<figure class=\"fig\"><svg class=\"plot\" viewBox=\"0 0 300 210\" width=\"300\" height=\"210\" xmlns=\"http://www.w3.org/2000/svg\" direction=\"ltr\" font-family=\"David Libre, Liberation Serif, serif\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/></marker><pattern id=\"hatch\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#777\" stroke-width=\"1\"/></pattern></defs><line x1=\"44.0\" y1=\"170.0\" x2=\"294.0\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"44.0\" y1=\"170.0\" x2=\"44.0\" y2=\"6.0\" stroke=\"#000\" stroke-width=\"1.4\" marker-end=\"url(#ah)\"/><line x1=\"129.1\" y1=\"167.0\" x2=\"129.1\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"129.1\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">40</text><line x1=\"150.4\" y1=\"167.0\" x2=\"150.4\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"150.4\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">50</text><line x1=\"171.6\" y1=\"167.0\" x2=\"171.6\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"171.6\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">60</text><line x1=\"256.7\" y1=\"167.0\" x2=\"256.7\" y2=\"173.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"256.7\" y=\"185.0\" text-anchor=\"middle\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">100</text><line x1=\"41.0\" y1=\"74.0\" x2=\"47.0\" y2=\"74.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"77.5\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">90</text><line x1=\"41.0\" y1=\"42.0\" x2=\"47.0\" y2=\"42.0\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"38.0\" y=\"45.5\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">120</text><text x=\"39.0\" y=\"184.0\" text-anchor=\"end\" font-size=\"10\" direction=\"ltr\" style=\"unicode-bidi:isolate\">0</text><text x=\"292.0\" y=\"204.0\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" direction=\"rtl\" style=\"unicode-bidi:isolate\">לחם</text><text x=\"52.0\" y=\"13.0\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" direction=\"rtl\" style=\"unicode-bidi:isolate\">עוגות</text><polyline points=\"44.0,42.0 129.1,63.3 171.6,84.7 256.7,170.0\" stroke=\"#000\" stroke-width=\"1.6\" fill=\"none\" stroke-linejoin=\"round\"/><line x1=\"150.4\" y1=\"74.0\" x2=\"150.4\" y2=\"170.0\" stroke=\"#000\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"150.4\" y1=\"74.0\" x2=\"44.0\" y2=\"74.0\" stroke=\"#000\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"44.0\" y1=\"74.0\" x2=\"44.0\" y2=\"42.0\" stroke=\"#000\" stroke-width=\"2.4\" fill=\"none\"/><circle cx=\"44.0\" cy=\"42.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"129.1\" cy=\"63.3\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"171.6\" cy=\"84.7\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"256.7\" cy=\"170.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><circle cx=\"150.4\" cy=\"74.0\" r=\"3.6\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"157.4\" y=\"67.0\" text-anchor=\"start\" font-size=\"12\" font-weight=\"700\" direction=\"ltr\" style=\"unicode-bidi:isolate\">(50,90)</text><text x=\"59.4\" y=\"62.0\" text-anchor=\"start\" font-size=\"11\" direction=\"ltr\" style=\"unicode-bidi:isolate\">TC(x)=30</text></svg><div class=\"figcap\">הנקודה על העקומה ב-50 טון לחם. העלות הכוללת היא הקטע על ציר y</div></figure>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> ד: 30 טונות עוגות.</div>", "per": {"א": "<span class=\"m\">0.6</span>. מי שבחר בה חישב עלות ממוצעת: <span class=\"m\">AC(x) = TC(x) / X = 30 / 50 = 0.6</span>. השאלה מבקשת עלות כוללת, לא עלות ליחידה.", "ב": "<span class=\"m\">20</span>. מי שבחר בה קרא את העלות הכוללת בנקודת הנתונים <span class=\"m\">x = 40</span>: <span class=\"m\">TC(x) = 120 − 100 = 20</span>. הכמות בשאלה היא 50, והיא נמצאת בתוך הקטע השני, ולכן העלות גדולה מ-20.", "ג": "<span class=\"m\">25</span>. מי שבחר בה הכפיל את כל 50 הטונות בשיפוע הקטע הראשון: <span class=\"m\">50 × 0.5 = 25</span>. אבל מ-<span class=\"m\">x = 40</span> השיפוע הוא 1, ולכן 10 הטונות האחרונות עולות יותר.", "ד": "<span class=\"m\">30</span>. <span class=\"m\">TC(x) = Ymax − Y = 120 − 90 = 30</span>, ובדיקה: <span class=\"m\">40 × 0.5 + 10 × 1 = 30</span>.", "ה": "<span class=\"m\">90</span>. מי שבחר בה נתן את y עצמו: <span class=\"m\">y = 90</span> הוא כמות העוגות שנשארת, לא מה שמוותרים עליו. העלות היא ההפרש <span class=\"m\">120 − 90 = 30</span>."}}, "1.18": {"id": "1.18", "set": "שאלות אמריקאיות ג׳", "kind": "concept", "ans": "ה", "stem": "<p>איזו מהטענות הבאות נכונה?</p>", "opts": [{"l": "א", "h": "העלות הכוללת של x היא תמיד גדולה מהכמות של x."}, {"l": "ב", "h": "העלות השולית של y נמדדת ביחידות של y."}, {"l": "ג", "h": "העלות הממוצעת של x היא <span class=\"m\">ΔY / ΔX</span>."}, {"l": "ד", "h": "בנקודה שבה מייצרים רק x, העלות הכוללת של y היא Xmax."}, {"l": "ה", "h": "בנקודה שבה מייצרים רק y, העלות הכוללת של x היא אפס."}], "shared": "<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">TC(x) = Ymax − Y</span> ו-<span class=\"m\">TC(y) = Xmax − X</span> (עלות כוללת של מוצר = הויתור על המוצר האחר)</div>\n<div class=\"key\">בשתי נקודות הקצה של העקומה מייצרים רק מוצר אחד, ושם אפשר לחשב את שתי העלויות הכוללות:</div>\n<table class=\"tb tight\">\n<caption>העלויות הכוללות בשתי נקודות הקצה</caption>\n<tbody>\n<tr class=\"hd\"><th>נקודה</th><th>מה מייצרים</th><th><span class=\"m\">TC(x)</span></th><th><span class=\"m\">TC(y)</span></th></tr>\n<tr><td><span class=\"m\">(Xmax, 0)</span></td><td>רק x</td><td><span class=\"m\">Ymax − 0 = Ymax</span></td><td><span class=\"m\">Xmax − Xmax = 0</span></td></tr>\n<tr><td><span class=\"m\">(0, Ymax)</span></td><td>רק y</td><td><span class=\"m\">Ymax − Ymax = 0</span></td><td><span class=\"m\">Xmax − 0 = Xmax</span></td></tr>\n</tbody></table>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> ה: בנקודה שבה מייצרים רק y, העלות הכוללת של x היא אפס.</div>", "per": {"א": "אין קשר קבוע בין העלות הכוללת לכמות. על הקו מ-<span class=\"m\">(0, 40)</span> עד <span class=\"m\">(60, 0)</span> ב-<span class=\"m\">x = 30</span>: <span class=\"m\">TC(x) = 40 − 20 = 20</span>, קטנה מ-30. על הקו מ-<span class=\"m\">(0, 90)</span> עד <span class=\"m\">(30, 0)</span> ב-<span class=\"m\">x = 10</span>: <span class=\"m\">TC(x) = 90 − 60 = 30</span>, גדולה מ-10. התוצאה תלויה בשיפוע.", "ב": "העלות השולית של y היא <span class=\"m\">MC(y) = ΔX / ΔY</span>, כלומר כמה x מוותרים עליו, ולכן היא נמדדת ביחידות של x. למשל <span class=\"m\">MC(y) = 60 / 40 = 1.5</span> יחידות x לכל יחידת y.", "ג": "<span class=\"m\">ΔY / ΔX</span> היא העלות השולית של x. העלות הממוצעת היא <span class=\"m\">AC(x) = TC(x) / X</span>. למשל בנקודה <span class=\"m\">(30, 20)</span> על הקו מ-<span class=\"m\">(0, 40)</span> עד <span class=\"m\">(60, 0)</span>: <span class=\"m\">TC(x) = 40 − 20 = 20</span> ו-<span class=\"m\">AC(x) = 20 / 30 = 2/3</span>, בעוד <span class=\"m\">MC(x) = 40 / 60 = 2/3</span>. הנוסחה בטענה שייכת לשולית.", "ד": "בנקודה <span class=\"m\">(Xmax, 0)</span> אין ייצור של y, ולכן אין ויתור על x: <span class=\"m\">TC(y) = Xmax − Xmax = 0</span>. הערך <span class=\"m\">Xmax</span> הוא העלות הכוללת של y בנקודה שבה מייצרים רק y. מי שבחר בה החליף בין שתי נקודות הקצה.", "ה": "בנקודה <span class=\"m\">(0, Ymax)</span> מייצרים רק y ולא x, ולכן לא מוותרים על y כדי לייצר x: <span class=\"m\">TC(x) = Ymax − Ymax = 0</span>."}}, "1.19": {"id": "1.19", "set": "שאלות אמריקאיות ג׳", "kind": "calc", "ans": "ב", "stem": "<p>עקומת התמורה של מפעל ״שחר״ היא קו ישר, שעובר בנקודה <span class=\"m\">(0, 40)</span> ובנקודה <span class=\"m\">(60, 0)</span>. x הוא ייצור מכונות ו-y הוא ייצור מנועים. מהי העלות השולית לייצור המנוע ה-25, במונחי מכונות?</p>", "opts": [{"l": "א", "h": "<span class=\"m\">2/3</span>"}, {"l": "ב", "h": "1.5"}, {"l": "ג", "h": "20"}, {"l": "ד", "h": "40"}, {"l": "ה", "h": "60"}], "shared": "<div class=\"key\">העקומה היא קו ישר אחד, ולכן העלות השולית זהה לכל יחידה. אין חשיבות לכך שזה המנוע ה-25. מבקשים עלות של y במונחי מכונות.</div>\n<div class=\"formula\"><span class=\"lab\">נוסחה:</span> <span class=\"m\">MC(y) = ΔX / ΔY</span> (ההופכי של השיפוע בערך מוחלט)</div>\n<div class=\"calc\">הצבה בין הנקודות <span class=\"m\">(0, 40)</span> ו-<span class=\"m\">(60, 0)</span>: <span class=\"m\">MC(y) = (60 − 0) / (40 − 0) = 60 / 40 = 1.5</span></div>\n<div class=\"ans\"><span class=\"lab\">תשובה:</span> ב: 1.5 מכונות לכל מנוע נוסף.</div>", "per": {"א": "<span class=\"m\">2/3</span>. מי שבחר בה חישב את שיפוע הקו, <span class=\"m\">MC(x) = ΔY / ΔX = 40 / 60 = 2/3</span>. זו העלות השולית של x (ויתור על מנועים ליחידת מכונות), ולא של y. צריך להפוך את היחס.", "ב": "<span class=\"m\">1.5</span>. <span class=\"m\">MC(y) = ΔX / ΔY = 60 / 40 = 1.5</span>. כל מנוע נוסף עולה 1.5 מכונות, בכל יחידה, כי הקו ישר.", "ג": "<span class=\"m\">20</span>. מי שבחר בה חישב הפרש בין שתי נקודות החיתוך: <span class=\"m\">60 − 40 = 20</span>. עלות שולית היא יחס בין שינויים, <span class=\"m\">ΔX / ΔY</span>, ולא הפרש בין נקודות. הפרש כזה גם נותן מספר שאינו תלוי ביחידות הנכונות.", "ד": "<span class=\"m\">40</span>. זה <span class=\"m\">Ymax</span>, מספר המנועים המקסימלי, ולא עלות שולית.", "ה": "<span class=\"m\">60</span>. זה <span class=\"m\">Xmax</span>, מספר המכונות המקסימלי, ולא עלות שולית. בדיקת היגיון: ויתור על 60 מכונות מניב 40 מנועים, ולכן מנוע אחד לא עולה 60 מכונות."}}, "1.20": {"id": "1.20", "set": "שאלות אמריקאיות ג׳", "kind": "concept", "ans": "ד", "stem": "<p>עקומת תמורה /* s07: איזו צורה יכולה להיות עקומת תמורה */
(function () {
  const SHAPES = [
    { pts: [[0, 10], [10, 0]], name: 'קו ישר יורד' },
    { pts: [[0, 10], [5, 9], [8, 6], [10, 0]], name: 'עקומה יורדת, התלילות גדלה' },
    { pts: [[0, 1], [10, 8]], name: 'קו עולה' },
    { pts: [[0, 10], [2, 5], [5, 2], [10, 0]], name: 'עקומה יורדת, התלילות קטנה' },
    { pts: [[0, 8], [4, 8], [10, 0]], name: 'חלק אופקי ואחריו ירידה' },
    { pts: [[0, 9], [3, 6], [5, 7], [7, 3], [10, 0]], name: 'ירידה עם בליטה' }
  ];
  const sl = v => (Math.abs(v * 100 - Math.round(v * 100)) < 1e-7) ? fmt(v) : fracStr(v);
  const signed = v => (v > 0 ? '+' : '') + sl(v);
  const mlist = a => m(a.map(sl).join(', '));

  /* analysis: every verdict and number comes from the points */
  function analyse(pts) {
    const segs = [];
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; segs.push({ a, b, s: (b[1] - a[1]) / (b[0] - a[0]) }); }
    const bad = segs.filter(g => g.s >= -1e-9);
    if (bad.length) {
      const g = bad[0];
      return { ok: false, kind: g.s > 1e-9 ? 'pos' : 'flat', segs, hl: bad, html: g.s > 1e-9
        ? `יש קטע עולה: שיפוע ${m(signed(g.s))}. בעקומת תמורה השיפוע שלילי בכל הקטעים, כי במחסור יותר x פירושו פחות y.`
        : `יש קטע אופקי: שיפוע ${m('0')}. שם אפשר להגדיל את x בלי לוותר על y, וזה סימן שהצירוף לא יעיל. השיפוע חייב להיות שלילי.` };
    }
    const ab = segs.map(g => -g.s);
    const shr = []; for (let i = 0; i < ab.length - 1; i++) if (ab[i + 1] < ab[i] - 1e-9) shr.push(segs[i + 1]);
    if (shr.length) return { ok: false, kind: 'shrink', segs, hl: shr, html: `השיפועים בערך מוחלט: ${mlist(ab)}. הם קטנים משמאל לימין. כל x נוסף עולה פחות y, וזה אינו מתאים לעקומת תמורה.` };
    const lin = ab.every(v => Math.abs(v - ab[0]) < 1e-9);
    return { ok: true, kind: lin ? 'linear' : 'concave', segs, hl: [], html: lin
      ? `שיפוע שלילי וקבוע: ${m('−' + sl(ab[0]))} בכל הקטעים. אפשרי: <t k="linear">עקומה ישרה</t>.`
      : `שיפוע שלילי, ובערך מוחלט הוא גדל: ${mlist(ab)}. אפשרי: <t k="concave">עקומה קעורה</t>.` };
  }
  SHAPES.forEach(s => { s.an = analyse(s.pts); });
  window.__s07 = SHAPES;   // for tests

  function sketch(host, s, mark, small) {
    const ch = PPC.chart(host, { w: 300, h: small ? 128 : 195, xmax: 11, ymax: 11, ml: 26, xLabel: 'x', yLabel: 'y', ticksX: [], ticksY: [], grid: false, showTicks: false });
    ch.curve(s.pts);
    s.pts.forEach(p => ch.dot(p[0], p[1], { cls: 'hollow', r: 3.5, layer: 'curve' }));
    if (mark) s.an.hl.forEach(g => PPC.el('path', { class: 'seg-hl', style: 'stroke:var(--bad)', d: `M${ch.sx(g.a[0])},${ch.sy(g.a[1])} L${ch.sx(g.b[0])},${ch.sy(g.b[1])}` }, ch.layer('ann')));
    return ch;
  }

  slide({
    id: 's07', kick: 'צורות', title: 'איזו צורה יכולה להיות עקומת תמורה?', mantra: ['m1', 'm7'],
    solves: [{ ex: '1.1', parts: 'סעיף ב' }], solvesQ: ['1.10'],
    build(root, ctx) {

        h('div.card.x', h('h3', 'כלל 1: שיפוע שלילי'), h('div', { html: 'כש-x גדל, y קטן. כך זה ב<t k="scarcity">מחסור</t>: משאבים מוגבלים, ולכן יותר x פירושו פחות y.' })),
        h('div.card.y', h('h3', 'כלל 2: קבוע או גדל בערך מוחלט'), h('div', { html: 'השיפוע שלילי, אבל התלילות לא קטנה משמאל לימין. מתחילים במי שהכי מתאים ל-x, ולכן כל x נוסף עולה יותר ויתור על y.' }))
      ];
      const done = {}; let nDone = 0, nRight = 0;
      const grid = h('div.s07-grid');
      const sum = h('div.fb.nt', { style: 'display:none' });
      SHAPES.forEach((s, i) => {
        const host = h('div');
        const card = h('div.card.s07-card', h('div.s07-t', h('b', 'שרטוט ' + (i + 1))), host);
        const ch = sketch(host, s, S, S);
        if (S) {
          card.appendChild(h('div.s07-v', h('b', { class: s.an.ok ? 'ok-c' : 'bad-c' }, s.an.ok ? 'אפשרי' : 'לא אפשרי'), h('div.s07-r', { html: s.an.html })));
          enhanceTerms(card);
        } else {
          const bY = h('button.btn.sm', { type: 'button' }, 'אפשרי'), bN = h('button.btn.sm', { type: 'button' }, 'לא אפשרי');
          const ans = h('div.s07-ans', bY, bN);

            if (!right) (s.an.ok ? bY : bN).classList.add('right');

            fb.style.display = ''; fb.className = 'fb ' + (right ? 'ok' : 'no'); fb.style.cssText = 'font-size:14px;line-height:1.35;margin:5px 0 0';
            fb.innerHTML = `<b>${right ? 'נכון' : 'לא מדויק'}: ${s.an.ok ? 'אפשרי' : 'לא אפשרי'}.</b> ${s.an.html}`; enhanceTerms(fb);
            ch.clear('ann'); s.an.hl.forEach(g => PPC.el('path', { class: 'seg-hl', style: 'stroke:var(--bad)', d: `M${ch.sx(g.a[0])},${ch.sy(g.a[1])} L${ch.sx(g.b[0])},${ch.sy(g.b[1])}` }, ch.layer('ann')));
            if (nDone === SHAPES.length) { sum.style.display = ''; sum.innerHTML = `<b>סיימתם: ${nRight} מתוך ${SHAPES.length}.</b> הכלל: שיפוע שלילי, קבוע או גדל בערך מוחלט.`; }
          }
          bY.addEventListener('click', () => pickAns(true)); bN.addEventListener('click', () => pickAns(false));
          card.append(ans, fb);
        }
        grid.appendChild(card);
      });

      let rules;
      if (S) {
        rules = h('div.s07-rules', mkRules());

        return;
      }
      const a1 = rv(ask('במשק שמנצל את כל המשאבים, מה קורה ל-y כשמייצרים עוד x? ולמה?', 'עצרו. התשובה בשלב הבא.'), 1);
      const [r1, r2] = mkRules(); rv(r1, 2); rv(r2, 4);
      const a2 = rv(ask('גם אם העקומה תמיד יורדת: האם כל ירידה מתאימה? מה עם ירידה שמתמתנת?', 'תנו לכיתה להתווכח. התשובה בשלב הבא.'), 3);
      const a3 = rv(ask('עכשיו בדקו כל שרטוט מול שני הכללים. מי שעוד לא סיווג, מסווג עכשיו.', 'לחצו על הכפתורים שבכל שרטוט ונמקו בקול.'), 5);
      const left = h('div.stack', h('p.lead', { style: 'font-size:19px;margin:0' }, 'שישה שרטוטים. אילו מהם יכולים לתאר עקומת תמורה? אפשר ללחוץ על "אפשרי" או "לא אפשרי" בכל שרטוט כבר עכשיו, או להתקדם להסבר.'), a1, r1, a2, r2, a3, sum);
      root.appendChild(h('div.s07-cols', grid, left));
