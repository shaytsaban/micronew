/* ===== shared helpers for slides s15-s19 (window.MCH) ===== */
window.MCH = (function () {
  const el = PPC.el;
  /* clean decimal, or a simple fraction when the decimal is not short (2/3) */
  const num = v => {
    const f = PPC.frac(v);
    if (f && f[1] !== 1 && Math.abs(v * 100 - Math.round(v * 100)) > 1e-9) return PPC.fracStr(v);
    if (Math.abs(v * 100 - Math.round(v * 100)) > 1e-9 && !f) return '≈' + fmt(v, 2);
    return fmt(v);
  };
  /* highlighted segment i of curve C (pink; cls 'y' makes it orange). animate: draw it along */
  function hlSeg(ch, C, i, o = {}) {
    const s = C.segs[i];
    const p = el('path', { class: 'seg-hl' + (o.cls ? ' ' + o.cls : ''), d: `M${ch.sx(s.a[0])},${ch.sy(s.a[1])} L${ch.sx(s.b[0])},${ch.sy(s.b[1])}` }, ch.layer(o.layer || 'ann'));
    if (o.animate) {
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = 'stroke-dashoffset .8s ease'; p.style.strokeDashoffset = 0; }));
    }
    return p;
  }
  /* slope triangle of a segment: dx along the top, dy on the right */
  function tri(ch, s, o = {}) {
    const [xa, ya] = s.a, [xb, yb] = s.b;
    ch.line(xa, ya, xb, ya, 'guide x mch-fi'); ch.line(xb, ya, xb, yb, 'guide y mch-fi');
    if (o.labels !== false) {
      const narrow = ch.sx(xb) - ch.sx(xa) < 70;
      ch.textPx(narrow ? ch.sx(xb) + 9 : (ch.sx(xa) + ch.sx(xb)) / 2, ch.sy(ya) - 9, 'ΔX = ' + fmt(s.dx), 'dlx mch-fi', narrow ? 'start' : 'middle');
      const legH = ch.sy(yb) - ch.sy(ya); ch.textPx(ch.sx(xb) + 9, ch.sy(ya) + legH * (legH < 80 ? 0.3 : 0.5) + 5, 'ΔY = ' + fmt(s.dy), 'dly mch-fi', 'start');
    }
  }
  /* staircase chart of values per range: bars=[{a,b,v,label?}] */
  function stairs(host, o) {
    const ch = PPC.chart(host, { w: o.w || 460, h: o.h || 240, xmax: o.xmax, ymax: o.ymax, xLabel: o.xLabel || 'x', yLabel: o.yLabel || 'MC', ticksX: o.ticksX || [], ticksY: [], aria: o.aria || 'מדרגות של עלות שולית' });
    function draw(bars, hi) {
      ch.clear('ann');
      bars.forEach((b, i) => {
        el('rect', { class: 'mch-bar' + (i === hi ? ' on' : ''), x: ch.sx(b.a), y: ch.sy(b.v), width: Math.max(0, ch.sx(b.b) - ch.sx(b.a)), height: Math.max(0, ch.sy(0) - ch.sy(b.v)) }, ch.layer('ann'));
        ch.textPx((ch.sx(b.a) + ch.sx(b.b)) / 2, ch.sy(b.v) - 6, b.label !== undefined ? b.label : num(b.v), 'mch-bv');
      });
    }
    return { ch, draw };
  }
  const ln = (html, cls) => h('div.mch-ln' + (cls ? '.' + cls : ''), { html });
  /* a pass/fail style progress dots element */
  return { num, hlSeg, tri, stairs, ln };
})();

/* s24: cost lab. Part 1: a pure question generator (LAB), exported on window for the node self test. Part 2: the slide. */
(function () {
  const LAB = (function () {
    const LET = 'ABCDEFGH';
    const F = v => PPC.fmt(v);
    const nm = v => { const r = Math.round(v * 100) / 100; return Math.abs(r - v) < 1e-9 ? PPC.fmt(v) : PPC.fracStr(v); };
    const mm = s => `<span class="m">${s}</span>`;
    const isInt = v => Math.abs(v - Math.round(v)) < 1e-9;
    const clean = v => isFinite(v) && PPC.frac(v) !== null;
    const segNm = i => LET[i] + LET[i + 1];
    /* ----- the bank: 10 curves, 3 to 5 segments, clean numbers, concave or straight ----- */
    const BANK = [
      { pts: [[0, 72], [12, 60], [30, 36], [42, 0]], X: 'שוקולד', Y: 'סוכריות' },
      { pts: [[0, 80], [10, 70], [20, 50], [30, 20], [35, 0]], X: 'קפה', Y: 'תה' },
      { pts: [[0, 90], [30, 70], [60, 40], [80, 0]], X: 'חיטה', Y: 'שעורה' },
      { pts: [[0, 100], [20, 80], [50, 50], [100, 0]], X: 'אורז', Y: 'עדשים' },
      { pts: [[0, 48], [8, 44], [20, 32], [24, 20], [28, 0]], X: 'גבינה', Y: 'חמאה' },
      { pts: [[0, 120], [40, 100], [60, 70], [80, 30], [90, 0]], X: 'תפוחים', Y: 'אגסים' },
      { pts: [[0, 36], [6, 30], [12, 20], [15, 11], [18, 0]], X: 'דבש', Y: 'ריבה' },
      { pts: [[0, 60], [15, 50], [45, 30], [90, 0]], X: 'עוגות', Y: 'עוגיות' },
      { pts: [[0, 150], [50, 130], [100, 90], [120, 50], [140, 0]], X: 'יוגורט', Y: 'קוטג׳' },
      { pts: [[0, 64], [16, 56], [32, 40], [48, 16], [56, 0]], X: 'תבלינים', Y: 'מלח' }
    ];
    const TYPES = ['tcx', 'tcy', 'acx', 'acy', 'mcx', 'mcy', 'dy', 'zone'];
    const TNAME = { tcx: 'TC(x)', tcy: 'TC(y)', acx: 'AC(x)', acy: 'AC(y)', mcx: 'MC(x)', mcy: 'MC(y)', dy: 'ΔY', zone: 'צירוף' };
    function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const pick = (a, r) => a[Math.floor(r() * a.length)];
    const vertsX = C => C.pts.map(p => p[0]);
    const vertsY = C => C.pts.map(p => p[1]);
    const idxVX = (C, x) => C.pts.findIndex(p => p[0] === x);
    const idxVY = (C, y) => C.pts.findIndex(p => p[1] === y);

    /* ---------- candidates ---------- */
    function cands(type, C, L) {
      const n = C.pts.length - 1, out = []; const inner = []; for (let i = 1; i < n; i++) inner.push(i);
      const vIdx = L >= 2 ? [0, ...inner, n] : inner;
      const intXs = []; for (let x = 1; x < C.xmax; x++) if (idxVX(C, x) < 0 && isInt(C.yAt(x))) intXs.push(x);
      const intYs = []; for (let y = 1; y < C.ymax; y++) if (idxVY(C, y) < 0 && isInt(C.xAt(y))) intYs.push(y);
      const ok = v => v === 'undef' || clean(v);
      if (type === 'tcx' || type === 'acx') {
        vIdx.forEach(i => { const x = C.pts[i][0]; const a = type === 'tcx' ? C.tcx(x) : (x === 0 ? 'undef' : C.acx(x)); if (ok(a)) out.push({ v: i, x, y: C.pts[i][1] }); });
        if (L >= 3) intXs.forEach(x => { const a = type === 'tcx' ? C.tcx(x) : C.acx(x); if (ok(a)) out.push({ x, y: C.yAt(x) }); });

    /* ---------- solution helpers (lines: f formula | r rule | t calc | a answer) ---------- */

      lines.push({ f: mm('y = y1 − (x − x1) × m'), lb: 'נוסחה (ערך בין נקודות)' });

      lines.push({ t: mm(`y = ${F(s.a[1])} − (${F(x)} − ${F(s.a[0])}) × ${nm(s.slope)} = ${F(y)}`) });

    /* ---------- build one question ---------- */

      (tg.ex || []).concat(tg.q || []).forEach(k => { map[k] = map[k] || []; if (!map[k].some(e => e.d === d)) map[k].push({ d }); });
    });
    const links = key => {
      if (COVERQ[key]) { const o = (map[key] || []).map(e => e.d.id); COVERQ[key].forEach(i => { if (!o.includes(i) && slides.find(z => z.id === i)) (map[key] = map[key] || []).push({ d: slides.find(z => z.id === i) }); }); }
      const arr = (map[key] || []).filter((e, i, a) => a.findIndex(z => z.d === e.d) === i);
      if (!arr.length) return h('span.hint', 'אין שקף ייעודי');
      return h('div', { style: 'display:flex;flex-wrap:wrap;gap:5px' }, arr.map(e => ctx.static
        ? h('span.chip', `שקף ${num(e.d.id)}`)
        : h('a.chip', { href: '#' + e.d.id, title: e.d.title, onclick: ev => { ev.preventDefault(); Deck.go(e.d.id); } }, `${num(e.d.id)}. ${e.d.title}`)));
    };
    if (ctx.static) {
      const rows = EXDATA.map(e => [h('b', e.id), e.title, h('span', { html: (COVER[e.id] || []).map(c => `<b>${c.p}</b>: שקף ${c.s.map(num).join(', ')}`).join(' &nbsp;·&nbsp; ') })]);
      root.appendChild(table(['תרגיל', 'נושא', 'סעיף: שקפים שמסבירים ומתרגלים'], rows));
      const qs = Object.keys(COVERQ).sort((a, b) => parseFloat(a.slice(2)) - parseFloat(b.slice(2)));
      const half = Math.ceil(qs.length / 2); const lab = q => [h('b', q + (HW_Q.includes(q) ? ' (בית)' : ' (כיתה)')), 'שקף ' + COVERQ[q].map(num).join(', ')];
      root.appendChild(h('div', { style: 'margin-top:8px' }, table(['שאלה', 'שקפים', 'שאלה', 'שקפים'], qs.slice(0, half).map((q, i) => lab(q).concat(qs[i + half] ? lab(qs[i + half]) : ['', ''])))));
      return;
    }
    const sec1 = h('h3', { style: 'margin:0 0 6px' }, 'תרגילים 1.1 עד 1.8');
    const g1 = h('div.hwg');
    const partRows = id => h('div.prt', (COVER[id] || []).map(c => h('div.pr', h('b', 'סעיף ' + c.p), h('span.pt2', c.t),
      h('span.pl', c.s.map(sid => { const d = slides.find(z => z.id === sid); if (!d) return null; return ctx.static ? h('span.chip', 'שקף ' + num(sid)) : h('a.chip', { href: '#' + sid, title: d.title, onclick: ev => { ev.preventDefault(); Deck.go(sid); } }, 'שקף ' + num(sid)); })))));
    EXDATA.forEach(e => g1.appendChild(h('div.hwc.hwe', { 'data-key': e.id }, h('b', `תרגיל ${e.id}: ${e.title}`), partRows(e.id))));
    const plain = s => s.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const qcard = (id, hw) => {
      const q = MCQDATA[id];
      const card = h('div.hwc', { 'data-key': id }, h('b', `שאלה ${id}`, h('span.hint', { style: 'margin-inline-start:8px' }, hw ? 'לבית' : 'בכיתה (חידון)')),
        h('div.tp', plain(q.stem).slice(0, 78) + '…'), h('div.go', links(id)));
      if (hw && !ctx.static) {
        const box = h('div', { style: 'display:none;margin-top:8px' }); let built = false;
        const b = h('button.btn', { type: 'button', style: 'margin-top:6px' }, 'לפתור כאן');
        b.addEventListener('click', () => { if (!built) { box.appendChild(MCQ(id)); enhanceTerms(box); built = true; } const open = box.style.display === 'none'; box.style.display = open ? 'block' : 'none'; b.textContent = open ? 'סגירה' : 'לפתור כאן'; if (open) card.style.gridColumn = '1 / -1'; else card.style.gridColumn = ''; });
        card.append(b, box);
      }
      return card;
    };
    const sec2 = h('h3', { style: 'margin:12px 0 6px' }, 'שאלות אמריקאיות 1.9 עד 1.20');
    const g2 = h('div.hwg'); CLASS_Q.concat(HW_Q).sort((a, b) => parseFloat(a.slice(2)) - parseFloat(b.slice(2))).forEach(id => g2.appendChild(qcard(id, HW_Q.includes(id))));
    const dl = h('div.card.ok', { style: 'margin-top:12px' }, h('b', 'חוברת תרגילי הבית'),
      h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;margin-top:6px' },
        ctx.static ? h('span', 'חוברת תרגילי הבית עם הפתרונות: בקובץ materials/homework-booklet.pdf') : [
          h('a.btn', { href: '../../materials/homework-booklet.pdf', target: '_blank', rel: 'noopener' }, 'חוברת תרגילי הבית עם הפתרונות (PDF)')]));
    root.append(sec1, g1, sec2, g2, dl);
  }
});

document.addEventListener('DOMContentLoaded',function(){Deck.init({title:"שיעור 1: עקומת התמורה"});});
</script>
